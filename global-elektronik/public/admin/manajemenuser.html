<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manajemen User - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/notification.css">
  <style>
    /* ===== BURGER MENU STYLES ===== */
    .burger-menu {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 30px;
      height: 21px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
    }

    .burger-menu span {
      display: block;
      height: 3px;
      width: 100%;
      background-color: #374151;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    .burger-menu.active span:nth-child(1) {
      transform: rotate(45deg) translate(6px, 6px);
      background-color: white;
    }

    .burger-menu.active span:nth-child(2) {
      opacity: 0;
    }

    .burger-menu.active span:nth-child(3) {
      transform: rotate(-45deg) translate(6px, -6px);
      background-color: white;
    }

    /* Mobile Sidebar Styles */
    .mobile-sidebar {
      position: fixed;
      top: 0;
      left: -100%;
      width: 280px;
      height: 100vh;
      background-color: #1f2937;
      transition: left 0.3s ease;
      z-index: 999;
      overflow-y: auto;
    }

    .mobile-sidebar.active {
      left: 0;
    }

    .mobile-sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 998;
      display: none;
    }

    .mobile-sidebar-overlay.active {
      display: block;
    }

    /* Sidebar item styles */
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      transition: all 0.2s;
      text-decoration: none;
      color: white;
      cursor: pointer;
    }

    .sidebar-item:hover {
      background-color: #374151;
    }

    .sidebar-item.active {
      background-color: #1f2937;
    }

    /* Main content adjustments */
    main {
      margin-left: 0 !important;
      width: 100%;
    }

    .main-header {
      padding-left: 60px !important;
    }

    /* Table styles */
    .table-container {
      overflow-x: visible;
    }

    .role-indicator {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .role-admin {
      background-color: #FEF3C7;
      color: #92400E;
    }

    .role-staff {
      background-color: #DBEAFE;
      color: #1E40AF;
    }

    .action-buttons {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }

    .btn-edit {
      background-color: #EAB308;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
    }

    .btn-edit:hover {
      background-color: #CA8A04;
      transform: scale(1.05);
    }

    .btn-delete {
      background-color: #DC2626;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
    }

    .btn-delete:hover {
      background-color: #B91C1C;
      transform: scale(1.05);
    }

    /* User modal */
    .user-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .user-modal.show {
      display: flex;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .table-container {
        overflow-x: auto;
      }
      
      .action-buttons {
        flex-direction: column;
        gap: 0.25rem;
      }
      
      .btn-edit, .btn-delete {
        font-size: 0.75rem;
        padding: 0.375rem 0.75rem;
      }
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const token = localStorage.getItem('token');
        const userRole = localStorage.getItem('userRole');
        
        if (!token || userRole !== 'admin') {
            window.notificationSystem.error(
                'Anda harus login sebagai admin untuk mengakses halaman ini',
                'Akses Ditolak!',
                {
                    duration: 3000,
                    onClose: () => {
                        window.location.href = '/login.html';
                    }
                }
            );
            return;
        }

        const username = localStorage.getItem('username');
        if (username) {
            document.getElementById('mobileWelcomeUser').textContent = `Welcome, ${username}!`;
        }

        loadUsers();
        setupSearch();
        setupUserModal();
        setupBurgerMenu();
    });

    // Burger Menu Functionality
    function setupBurgerMenu() {
      const burgerMenu = document.getElementById('burgerMenu');
      const mobileSidebar = document.getElementById('mobileSidebar');
      const sidebarOverlay = document.getElementById('sidebarOverlay');

      burgerMenu.addEventListener('click', function() {
        this.classList.toggle('active');
        mobileSidebar.classList.toggle('active');
        sidebarOverlay.classList.toggle('active');
      });

      sidebarOverlay.addEventListener('click', function() {
        burgerMenu.classList.remove('active');
        mobileSidebar.classList.remove('active');
        this.classList.remove('active');
      });

      // Close sidebar when clicking on links
      const sidebarLinks = mobileSidebar.querySelectorAll('a, button');
      sidebarLinks.forEach(link => {
        link.addEventListener('click', () => {
          burgerMenu.classList.remove('active');
          mobileSidebar.classList.remove('active');
          sidebarOverlay.classList.remove('active');
        });
      });
    }

    function logout() {
        window.notificationSystem.confirmDialog(
            'Apakah Anda yakin ingin logout?',
            'Konfirmasi Logout',
            () => {
                localStorage.removeItem('token');
                localStorage.removeItem('userRole');
                localStorage.removeItem('username');
                localStorage.removeItem('userId');
                window.location.href = '/login.html';
            },
            {
                confirmText: 'Ya, Logout',
                cancelText: 'Batal',
                showCloseButton: true
            }
        );
    }

    async function loadUsers() {
        try {
            const tableBody = document.getElementById('usersTable');
            tableBody.innerHTML = `
                <tr>
                    <td colspan="4" class="px-6 py-8 text-center">
                        <div class="flex justify-center items-center">
                            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                            <span class="ml-2 text-gray-600">Memuat data user...</span>
                        </div>
                    </td>
                </tr>
            `;

            const token = localStorage.getItem('token');
            const response = await fetch('/api/users', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            const result = await response.json();

            if (result.success) {
                displayUsers(result.data);
                updateStatistics(result.data);
                
                if (result.data.length === 0) {
                    window.notificationSystem.info(
                        'Belum ada user yang terdaftar. Silakan tambah user baru.',
                        'Data Kosong',
                        {
                            showCloseButton: true,
                            confirmText: 'Mengerti'
                        }
                    );
                }
            } else {
                window.notificationSystem.error(
                    result.message || 'Gagal memuat data user. Silakan refresh halaman.',
                    'Error Memuat Data!',
                    {
                        showCloseButton: true,
                        confirmText: 'Tutup'
                    }
                );
            }
        } catch (error) {
            console.error('Error loading users:', error);
            window.notificationSystem.error(
                'Terjadi kesalahan saat memuat data user. Periksa koneksi internet.',
                'Error Jaringan!',
                {
                    showCloseButton: true,
                    confirmText: 'Tutup'
                }
            );
        }
    }

    function displayUsers(users) {
        const tableBody = document.getElementById('usersTable');
        tableBody.innerHTML = '';

        if (users.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="4" class="px-6 py-8 text-center text-gray-500">
                        <div class="flex flex-col items-center">
                            <svg class="w-16 h-16 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path>
                            </svg>
                            <p class="text-lg font-medium">Tidak ada user</p>
                            <p class="text-sm">Klik "Tambah User Baru" untuk menambahkan user pertama</p>
                        </div>
                    </td>
                </tr>
            `;
            return;
        }

        users.forEach(user => {
            const createdDate = new Date(user.created_at).toLocaleDateString('id-ID');
            const currentUserId = parseInt(localStorage.getItem('userId'));
            
            const row = document.createElement('tr');
            row.className = 'hover:bg-gray-50 transition';
            row.innerHTML = `
                <td class="px-6 py-4 font-medium text-gray-900">
                    <div class="flex items-center">
                        <span class="max-w-xs truncate" title="${user.username}">${user.username}</span>
                        ${user.user_id === currentUserId ? '<span class="ml-2 text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">Anda</span>' : ''}
                    </div>
                </td>
                <td class="px-6 py-4">
                    <span class="role-indicator ${user.role === 'admin' ? 'role-admin' : 'role-staff'}">
                        ${user.role === 'admin' ? '👑 Admin' : '👨‍💼 Staff'}
                    </span>
                </td>
                <td class="px-6 py-4 text-gray-600">${createdDate}</td>
                <td class="px-6 py-4">
                    <div class="action-buttons">
                        <button onclick="editUser(${user.user_id})" class="btn-edit">
                            ✏️ Edit
                        </button>
                        <button onclick="deleteUser(${user.user_id})" 
                                class="btn-delete" 
                                ${user.user_id === currentUserId ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : ''}>
                            🗑️ Hapus
                        </button>
                    </div>
                </td>
            `;
            tableBody.appendChild(row);
        });
    }

    function updateStatistics(users) {
        const totalUsers = users.length;
        const adminUsers = users.filter(user => user.role === 'admin').length;
        const staffUsers = users.filter(user => user.role === 'staff').length;

        document.getElementById('totalUsers').textContent = totalUsers;
        document.getElementById('statsTotal').textContent = totalUsers;
        document.getElementById('statsAdmin').textContent = adminUsers;
        document.getElementById('statsStaff').textContent = staffUsers;
    }

    async function deleteUser(userId) {
        const userName = await getUserName(userId);
        const currentUserId = parseInt(localStorage.getItem('userId'));
        
        if (userId === currentUserId) {
            window.notificationSystem.error(
                'Tidak dapat menghapus akun sendiri.',
                'Error!',
                {
                    showCloseButton: true,
                    confirmText: 'Tutup'
                }
            );
            return;
        }
        
        window.notificationSystem.confirmDialog(
            `Apakah Anda yakin ingin menghapus user <strong>"${userName}"</strong>? Tindakan ini tidak dapat dibatalkan.`,
            'Konfirmasi Hapus User',
            async () => {
                try {
                    const token = localStorage.getItem('token');
                    const response = await fetch(`/api/users/${userId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    const result = await response.json();

                    if (result.success) {
                        window.notificationSystem.success(
                            `User "${userName}" berhasil dihapus dari sistem.`,
                            'User Dihapus!',
                            {
                                showCloseButton: true,
                                confirmText: 'Tutup',
                                duration: 4000
                            }
                        );
                        loadUsers();
                    } else {
                        window.notificationSystem.error(
                            result.message || `Gagal menghapus user "${userName}".`,
                            'Gagal Menghapus!',
                            {
                                showCloseButton: true,
                                confirmText: 'Tutup'
                            }
                        );
                    }
                } catch (error) {
                    console.error('Error deleting user:', error);
                    window.notificationSystem.error(
                        `Terjadi kesalahan saat menghapus user "${userName}".`,
                        'Error!',
                        {
                            showCloseButton: true,
                            confirmText: 'Tutup'
                        }
                    );
                }
            },
            {
                confirmText: 'Ya, Hapus',
                cancelText: 'Batal',
                showCloseButton: true,
                type: 'error'
            }
        );
    }

    async function getUserName(userId) {
        try {
            const token = localStorage.getItem('token');
            const response = await fetch(`/api/users/${userId}`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            const result = await response.json();
            return result.success ? result.data.username : 'User';
        } catch (error) {
            return 'User';
        }
    }

    function editUser(userId) {
        openUserModal(userId);
    }

    function setupUserModal() {
        const modal = document.getElementById('userModal');
        const closeBtn = document.getElementById('closeUserModal');
        const cancelBtn = document.getElementById('cancelUser');
        const form = document.getElementById('userForm');

        // Close modal events
        [closeBtn, cancelBtn].forEach(btn => {
            btn.addEventListener('click', () => {
                modal.classList.remove('show');
            });
        });

        // Close modal when clicking outside
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('show');
            }
        });

        // Form submission
        form.addEventListener('submit', handleUserFormSubmit);
    }

    function openAddUserModal() {
        const modal = document.getElementById('userModal');
        const form = document.getElementById('userForm');
        
        form.reset();
        form.dataset.mode = 'add';
        form.dataset.userId = '';
        
        document.getElementById('modalTitle').textContent = 'Tambah User Baru';
        document.getElementById('submitUserBtn').textContent = 'Tambah User';
        document.getElementById('password').required = true;
        document.getElementById('passwordHint').textContent = '(wajib untuk user baru)';
        
        modal.classList.add('show');
    }

    function closeUserModal() {
        document.getElementById('userModal').classList.remove('show');
    }

    async function openUserModal(userId = null) {
        if (userId) {
            // Edit mode
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`/api/users/${userId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const result = await response.json();

                if (result.success) {
                    const user = result.data;
                    const modal = document.getElementById('userModal');
                    const form = document.getElementById('userForm');
                    
                    document.getElementById('username').value = user.username;
                    document.getElementById('role').value = user.role;
                    document.getElementById('password').required = false;
                    document.getElementById('passwordHint').textContent = '(kosongkan jika tidak ingin mengubah)';

                    document.getElementById('modalTitle').textContent = 'Edit User';
                    document.getElementById('submitUserBtn').textContent = 'Update User';
                    form.dataset.mode = 'edit';
                    form.dataset.userId = userId;

                    modal.classList.add('show');
                } else {
                    window.notificationSystem.error(
                        'Gagal memuat data user.',
                        'Error!',
                        {
                            showCloseButton: true,
                            confirmText: 'Tutup'
                        }
                    );
                }
            } catch (error) {
                console.error('Error loading user data:', error);
                window.notificationSystem.error(
                    'Terjadi kesalahan saat memuat data user.',
                    'Error!',
                    {
                        showCloseButton: true,
                        confirmText: 'Tutup'
                    }
                );
            }
        } else {
            // Add mode
            openAddUserModal();
        }
    }

    async function handleUserFormSubmit(event) {
        event.preventDefault();
        
        const form = event.target;
        const formData = new FormData(form);
        const data = {
            username: formData.get('username').trim(),
            role: formData.get('role')
        };

        // Validasi
        if (!data.username || !data.role) {
            window.notificationSystem.warning(
                'Username dan role harus diisi',
                'Form Tidak Lengkap',
                {
                    showCloseButton: true,
                    confirmText: 'Mengerti'
                }
            );
            return;
        }

        if (data.username.length < 3) {
            window.notificationSystem.warning(
                'Username harus minimal 3 karakter',
                'Username Tidak Valid',
                {
                    showCloseButton: true,
                    confirmText: 'Mengerti'
                }
            );
            return;
        }

        // Jika mode tambah, password wajib diisi
        if (form.dataset.mode === 'add') {
            const password = formData.get('password');
            if (!password) {
                window.notificationSystem.warning(
                    'Password harus diisi untuk user baru',
                    'Form Tidak Lengkap',
                    {
                        showCloseButton: true,
                        confirmText: 'Mengerti'
                    }
                );
                return;
            }
            if (password.length < 6) {
                window.notificationSystem.warning(
                    'Password harus minimal 6 karakter',
                    'Password Terlalu Pendek',
                    {
                        showCloseButton: true,
                        confirmText: 'Mengerti'
                    }
                );
                return;
            }
            data.password = password;
        } else {
            // Jika mode edit, password opsional
            const password = formData.get('password');
            if (password && password.length > 0) {
                if (password.length < 6) {
                    window.notificationSystem.warning(
                        'Password harus minimal 6 karakter',
                        'Password Terlalu Pendek',
                        {
                            showCloseButton: true,
                            confirmText: 'Mengerti'
                        }
                    );
                    return;
                }
                data.password = password;
            }
        }

        const token = localStorage.getItem('token');
        let url = '/api/users';
        let method = 'POST';

        if (form.dataset.mode === 'edit') {
            url = `/api/users/${form.dataset.userId}`;
            method = 'PUT';
        }

        // Tampilkan loading state
        const submitBtn = document.getElementById('submitUserBtn');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Menyimpan...';
        submitBtn.disabled = true;

        try {
            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (result.success) {
                window.notificationSystem.success(
                    result.message,
                    'Sukses!',
                    {
                        duration: 3000,
                        showCloseButton: true,
                        confirmText: 'Tutup',
                        onClose: () => {
                            closeUserModal();
                            loadUsers();
                        }
                    }
                );
            } else {
                window.notificationSystem.error(
                    result.message,
                    'Gagal!',
                    {
                        showCloseButton: true,
                        confirmText: 'Tutup'
                    }
                );
            }
        } catch (error) {
            console.error('Error submitting user form:', error);
            window.notificationSystem.error(
                'Terjadi kesalahan jaringan.',
                'Error!',
                {
                    showCloseButton: true,
                    confirmText: 'Tutup'
                }
            );
        } finally {
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
        }
    }

    function setupSearch() {
        const searchInput = document.getElementById("searchInput");
        searchInput.addEventListener("input", e => {
            const value = e.target.value.toLowerCase();
            let hasResults = false;
            
            document.querySelectorAll("#usersTable tr").forEach(row => {
                const text = row.textContent.toLowerCase();
                const isVisible = text.includes(value);
                row.style.display = isVisible ? "" : "none";
                
                if (isVisible) hasResults = true;
            });

            const noResultsRow = document.getElementById('noResults');
            if (!hasResults && value !== '') {
                if (!noResultsRow) {
                    const tableBody = document.getElementById('usersTable');
                    const row = document.createElement('tr');
                    row.id = 'noResults';
                    row.innerHTML = `
                        <td colspan="4" class="px-6 py-8 text-center text-gray-500">
                            <div class="flex flex-col items-center">
                                <svg class="w-16 h-16 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                                <p class="text-lg font-medium">Tidak ada hasil ditemukan</p>
                                <p class="text-sm">Coba gunakan kata kunci yang berbeda</p>
                            </div>
                        </td>
                    `;
                    tableBody.appendChild(row);
                }
            } else if (noResultsRow) {
                noResultsRow.remove();
            }
        });
    }
  </script>
</head>
<body class="bg-gray-100">

  <!-- Burger Menu Button -->
  <button class="burger-menu" id="burgerMenu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="flex min-h-screen">
    <!-- Main Content -->
    <main class="flex-1 p-8 main-header">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-3xl font-bold text-gray-800">Manajemen User</h2>
          <p class="text-sm text-gray-500 mt-1">Kelola user yang memiliki akses ke sistem</p>
        </div>
        <div class="flex items-center gap-4">
          <span class="text-sm text-gray-600 bg-white px-3 py-1 rounded-lg border">
            👥 Total: <span id="totalUsers">0</span> user
          </span>
          <button onclick="openAddUserModal()"
            class="bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-blue-700 font-semibold transition transform hover:scale-105 shadow-lg">
            ➕ Tambah User Baru
          </button>
        </div>
      </div>

      <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <div class="w-full md:w-1/2">
          <input id="searchInput" type="text"
            placeholder="🔍 Cari berdasarkan username..."
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
        </div>
        <div class="w-full md:w-auto flex gap-2">
          <button onclick="loadUsers()" 
                  class="bg-green-600 text-white py-3 px-6 rounded-lg hover:bg-green-700 font-semibold transition">
            🔄 Refresh Data
          </button>
        </div>
      </div>

      <div class="bg-white shadow-lg rounded-lg overflow-hidden">
        <div class="table-container">
          <table class="min-w-full divide-y divide-gray-200 text-sm">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-6 py-4 text-left font-medium text-gray-600 uppercase tracking-wider">Username</th>
                <th class="px-6 py-4 text-left font-medium text-gray-600 uppercase tracking-wider">Role</th>
                <th class="px-6 py-4 text-left font-medium text-gray-600 uppercase tracking-wider">Dibuat</th>
                <th class="px-6 py-4 text-center font-medium text-gray-600 uppercase tracking-wider">Aksi</th>
              </tr>
            </thead>

            <tbody class="divide-y divide-gray-100" id="usersTable">
              <!-- Data akan diisi oleh JavaScript -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Statistics Cards -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8">
        <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500">
          <div class="flex items-center">
            <div class="bg-blue-100 p-3 rounded-lg">
              <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path>
              </svg>
            </div>
            <div class="ml-4">
              <p class="text-sm font-medium text-gray-600">Total User</p>
              <p class="text-2xl font-bold text-gray-900" id="statsTotal">0</p>
            </div>
          </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-purple-500">
          <div class="flex items-center">
            <div class="bg-purple-100 p-3 rounded-lg">
              <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </div>
            <div class="ml-4">
              <p class="text-sm font-medium text-gray-600">Admin</p>
              <p class="text-2xl font-bold text-gray-900" id="statsAdmin">0</p>
            </div>
          </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500">
          <div class="flex items-center">
            <div class="bg-green-100 p-3 rounded-lg">
              <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
              </svg>
            </div>
            <div class="ml-4">
              <p class="text-sm font-medium text-gray-600">Staff</p>
              <p class="text-2xl font-bold text-gray-900" id="statsStaff">0</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="mobile-sidebar" id="mobileSidebar">

      <p class="text-sm text-gray-300 mt-1" id="mobileWelcomeUser">Welcome, Admin!</p>
    </div>

    <nav class="flex-1 p-4 space-y-2">

      <a href="./manajemenuser.html" class="sidebar-item active">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path>

  <div class="mobile-sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Modal untuk Tambah/Edit User -->
  <div id="userModal" class="user-modal">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-lg mx-4">
      <div class="flex justify-between items-center p-6 border-b">
        <h3 id="modalTitle" class="text-xl font-semibold text-gray-800">Tambah User Baru</h3>
        <button id="closeUserModal" class="text-gray-400 hover:text-gray-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      
      <form id="userForm" class="p-6">
        <div class="mb-4">
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username *</label>
          <input type="text" id="username" name="username" required 
                 placeholder="Masukkan username"
                 class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
        </div>
        
        <div class="mb-4">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
            Password 
            <span class="text-xs text-gray-500 font-normal" id="passwordHint">(wajib untuk user baru)</span>
          </label>
          <input type="password" id="password" name="password" 
                 placeholder="Masukkan password (minimal 6 karakter)"
                 class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
        </div>
        
        <div class="mb-4">
          <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Role *</label>
          <select id="role" name="role" required 
                  class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
            <option value="staff">Staff</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        
        <div class="flex justify-end gap-3 mt-6">
          <button type="button" id="cancelUser" 
                  class="px-6 py-3 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 font-semibold transition">
            Batal
          </button>
          <button type="submit" id="submitUserBtn"
                  class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold transition">
            Tambah User
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/notification.js"></script>
